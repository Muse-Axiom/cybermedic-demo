<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>CMS WebMCP diagnostics</title>
<meta name="robots" content="noindex">
<style>body{font-family:monospace;padding:24px;max-width:900px}pre{background:#f4f4f4;padding:16px;overflow:auto}button{padding:10px 18px;font-size:15px;margin:6px 6px 6px 0}</style>
</head>
<body>
<h1>WebMCP diagnostics (not linked from site)</h1>
<pre id="out">running…</pre>
<button id="btn-book">Simulate agent booking call</button>
<button id="btn-details">Call get_lunch_and_learn_details</button>
<pre id="out2"></pre>
<script src="../assets/webmcp.js"></script>
<script>
(async function () {
  var out = document.getElementById("out");
  var diag = window.__cmsWebMCP || {};
  var report = {
    apiPresent: !!diag.apiPresent,
    apiSource: (document && document.modelContext) ? "document.modelContext" : ((navigator && navigator.modelContext) ? "navigator.modelContext" : "none"),
    registeredByScript: diag.registered || [],
    userAgent: navigator.userAgent
  };
  try {
    var mc = (document && document.modelContext) || (navigator && navigator.modelContext);
    if (mc && mc.getTools) {
      var tools = await mc.getTools();
      report.discoveredTools = tools.map(function (t) { return { name: t.name, description: (t.description || "").slice(0, 80) }; });
    } else {
      report.discoveredTools = "getTools not available";
    }
  } catch (e) { report.discoverError = String(e); }
  out.textContent = JSON.stringify(report, null, 2);

  async function callTool(name, args) {
    var mc = (document && document.modelContext) || (navigator && navigator.modelContext);
    if (!mc || !mc.executeTool) return { error: "executeTool unavailable" };
    return await mc.executeTool(name, args);
  }
  document.getElementById("btn-book").onclick = async function () {
    var r = await callTool("book_lunch_and_learn", {
      practice_name: "Demo Dental of Raleigh",
      contact_name: "Test Manager",
      contact_phone_or_email: "(919) 555-0199",
      office_address: "123 Test St, Raleigh, NC",
      preferred_date: "Tuesday morning",
      party_size: "9"
    });
    document.getElementById("out2").textContent = "BOOKING RESULT:\n" + JSON.stringify(r, null, 2);
  };
  document.getElementById("btn-details").onclick = async function () {
    var r = await callTool("get_lunch_and_learn_details", {});
    document.getElementById("out2").textContent = "DETAILS RESULT:\n" + JSON.stringify(r, null, 2).slice(0, 1200);
  };
})();
</script>
</body>
</html>
